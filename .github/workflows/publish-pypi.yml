name: Publish to PyPI

# Publishes the package to PyPI when you push a version tag (e.g. v0.1.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret needed.
# One-time setup on PyPI: https://pypi.org/manage/account/publishing/
#   Project: webrecon-scanner | Owner: DanishDhanjal15 | Repo: CYBER-TOOL
#   Workflow: publish-pypi.yml   (Environment: pypi)
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
