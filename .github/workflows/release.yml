name: Release

# Push a version tag (e.g. v0.1.0) to build the exe and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build standalone exe
        run: pyinstaller webrecon.spec --clean --noconfirm
      - name: Smoke-check the exe
        run: dist\webrecon.exe --version
      - name: Publish GitHub Release with the exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/webrecon.exe
          generate_release_notes: true
          body: |
            ## WebRecon ${{ github.ref_name }}

            Download **webrecon.exe** below — a standalone Windows build, no Python
            needed. Run it from a terminal:

            ```
            webrecon.exe scan http://example.com --authorize
            ```

            ⚠️ Authorized testing only — scan systems you own or are permitted to test.
