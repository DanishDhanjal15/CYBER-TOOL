[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name ('webrecon' was taken). The import package and the CLI
# command are still `webrecon` — only the pip-install name differs.
name = "webrecon-scanner"
version = "0.1.1"
description = "A from-scratch Python CLI web vulnerability scanner + vuln-management toolkit (authorized testing only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Danish Dhanjal" }]
keywords = ["security", "vulnerability-scanner", "pentest", "web-security",
            "owasp", "dast", "infosec", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "dnspython>=2.4",
    "jinja2>=3.1",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/DanishDhanjal15/CYBER-TOOL"
Repository = "https://github.com/DanishDhanjal15/CYBER-TOOL"
Issues = "https://github.com/DanishDhanjal15/CYBER-TOOL/issues"
Changelog = "https://github.com/DanishDhanjal15/CYBER-TOOL/blob/main/CHANGELOG.md"

[project.scripts]
webrecon = "webrecon.cli:main"
webrecon-gui = "webrecon.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = [
    "webrecon",
    "webrecon.core",
    "webrecon.recon",
    "webrecon.checks",
    "webrecon.model",
    "webrecon.report",
    "webrecon.data",
    "webrecon.cicd",
    "webrecon.mlscan",
    "webrecon.reliability",
    "webrecon.templates_engine",
    "webrecon.browser",
    "webrecon.storage",
    "webrecon.analysis",
    "webrecon.monitor",
]

[tool.setuptools.package-data]
"webrecon.report" = ["templates/*.j2"]
"webrecon.data" = ["payloads/*.txt", "wordlists/*.txt", "signatures/*.txt", "templates/*.yaml", "cve/*.json"]
